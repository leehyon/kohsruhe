baseURL = 'https://www.kohsruhe.com/'
title = 'Kohsruhe'
theme = 'den'

enableRobotsTXT = true                  # generate robots.txt
enableEmoji = true                      # use emoji support
hasCJKLanguage = true                   # detect CJK languages for word count etc.
preserveTaxonomyNames = true            # do not make tag names lowercase
rssLimit = 100                          # limit number of entries in RSS feeds

# Syntax hightlight
PygmentsCodeFences = true
PygmentsUseClasses = true               # required for shhighlight shortcode

# Service plugins
disqusShortname = '' # disqus_shortname
googleAnalytics = '' # UA-XXXXXXXX-X

defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = true  # true if you want to use /zh/ in URL

# Title case style
# https://github.com/gohugoio/hugo/issues/12115
titleCaseStyle = 'none'

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[permalinks]
  posts = '/:year/:month/:contentbasename/'
  categories = '/category/:slug/'       # required
  tags = '/tag/:slug/'                  # required
  pages = '/:slug/'

[sitemap] # required
  changefreq = 'weekly'
  priority = 0.5
  filename = 'sitemap.xml'

# Params
[params]
  since = '2022'                          # Site creation time
  rssFullContent = true                   # set true to use full content instead of summary

  # site info (optional)
  keywords = ["hugo", "embedded", "programming"]
  description = "Wouldn't be a Noble mission if it were easy."
  logoTitle = 'Koh'                       # shown on top-left, default: title
  siteLogoImage = 'images/noble.png'      # shown besides logoTitle
  # headerTitle = "Kohsruhe"              # default: title
  headerImage = 'images/lake.jpeg'
  showAuthorCard = true                   # Whether to show author information below the article

  showMenuLanguages = true

  autoLoadComments = false                # auto load comment when scrolling down

  # paginate style, default use numbered pagination links
  # if true, use original "Previous" and "Next" links.
   paginateOriginalStyle = true

  # The date format to use; for a list of valid formats, see https://gohugo.io/functions/format/
  dateFormatToUse = '2006-01-02'

  google_verification = ''                # Google_Verification

## Cusdis comment system
[params.cusdis]
  app_id = '50b5d4e4-6f9c-470a-a152-72bf1b7ecdbb'   # override per environment in a private config
  host = 'https://cusdis.com'

  # Link custom CSS and JS assets
  #   (relative to /static/css and /static/js respectively)
  customCSS = [
    'custom.css',
  ] # if ['custom.css'], load '/static/css/custom.css' file
  customJS = [] # if ['custom.js'], load '/static/js/custom.js' file

[params.author]
  email = 'kohsruhe@outlook.com'
  name = 'Leehyon HNG'

## Mermaid configuration
[params.mermaid]
  theme = 'neutral'  # Optional theme: "default" | "base" | "dark" | "forest" | "neutral" | "null"
  # Pin a specific Mermaid version so the browser-loads-from-CDN path stays
  # stable across builds. Update intentionally.
  version = '11.4.1'

## Markmap configuration
[params.markmap]
  enable = true

[markup]
  [markup.goldmark]
    duplicateResourceFiles = false
    [markup.goldmark.renderer]
      hardWraps = false
      unsafe = true
      xhtml = false

# Related content
[related]
  includeNewer = true
  threshold = 50
  toLower = true
  [[related.indices]]
    name = 'categories'
    weight = 200
  [[related.indices]]
    name = 'keywords'
    weight = 150
  [[related.indices]]
    name = 'tags'
    weight = 100

# Multilingual mode
# Use a single configuration file to manage multiple languages

[languages]
  [languages.zh]
    disabled = false
    weight = 1
    [languages.zh.params]
      locale = 'zh'
      label = 'ZH'
      subtitle = "Wouldn't be a Noble mission if it were easy."
    [languages.zh.menus]
      [[languages.zh.menu.main]]
        name = "博客"
        weight = 10
        identifier = "blog"
        url = "category/blog/"
      [[languages.zh.menu.main]]
        name = "笔记"
        weight = 20
        identifier = "notes"
        url = "category/notes/"
      [[languages.zh.menu.social]]
        name = "Telegram"
        weight = 10
        identifier = "telegram"
        url = "https://t.me/kohsorbit"
      [[languages.zh.menu.social]]
        name = "Instagram"
        weight = 20
        identifier = "instagram"
        url = "https://www.instagram.com/kohsruhe/"
      [[languages.zh.menu.links]]
        name = "GitHub"
        weight = 10
        identifier = "github"
        url = "https://github.com/leehyon"
      [[languages.zh.menu.links]]
        name = "Koh's Garden"
        weight = 20
        identifier = "garden"
        url = "https://garden.kohsruhe.com/"
  [languages.en]
    disabled = false
    weight = 2
    [languages.en.params]
      locale = 'en'
      label = 'EN'
      subtitle = "Wouldn't be a Noble mission if it were easy."
    [languages.en.menus]
      [[languages.en.menu.main]]
        name = "Blog"
        weight = 10
        identifier = "blog"
        url = "category/blog/"
      [[languages.en.menu.main]]
        name = "Notes"
        weight = 20
        identifier = "notes"
        url = "category/notes/"
      [[languages.en.menu.social]]
        name = "Telegram"
        weight = 10
        identifier = "telegram"
        url = "https://t.me/kohsorbit"
      [[languages.en.menu.social]]
        name = "Instagram"
        weight = 20
        identifier = "instagram"
        url = "https://www.instagram.com/kohsruhe/"
      [[languages.en.menu.links]]
        name = "GitHub"
        weight = 10
        identifier = "github"
        url = "https://github.com/leehyon"
      [[languages.en.menu.links]]
        name = "Koh's Garden"
        weight = 20
        identifier = "garden"
        url = "https://garden.kohsruhe.com/"
